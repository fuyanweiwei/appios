name: MyNavigation
options:
  bundleIdPrefix: com.weiwei
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 6
    MARKETING_VERSION: "1.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  MyNavigation:
    type: application
    platform: iOS
    sources:
      - path: MyNavigation
    dependencies:
      # 嵌入桌面小组件与分享扩展（App 内打包时自动带上）
      - target: MyWidget
        embed: true
      - target: ShareExtension
        embed: true
    info:
      path: MyNavigation/Info.plist
      properties:
        CFBundleDisplayName: 薇薇导航
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 站点为自签名证书 + 可能走 http，与安卓端 TrustAll/usesCleartextTraffic 对齐
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSCameraUsageDescription: 拍照作为日常配图 / 扫描二维码
        NSPhotoLibraryUsageDescription: 从相册选择图片作为日常配图
        NSPhotoLibraryAddUsageDescription: 把图片保存到相册（薇薇导航相簿）
        CFBundleURLTypes:
          - CFBundleURLName: com.weiwei.mynavigation
            CFBundleURLSchemes:
              - mynavigation
        # P4 后台通知轮询（BGAppRefreshTask，Core/NotificationPoll.swift）
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.weiwei.mynavigation.notifpoll
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weiwei.mynavigation
        INFOPLIST_FILE: MyNavigation/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: MyNavigation/MyNavigation.entitlements

  MyWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: MyWidget
    info:
      path: MyWidget/Info.plist
      properties:
        CFBundleDisplayName: 薇薇导航
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weiwei.mynavigation.widget
        INFOPLIST_FILE: MyWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: MyWidget/MyWidget.entitlements

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: 存到贴板
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionActivationRule: TRUEPREDICATE
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weiwei.mynavigation.share
        INFOPLIST_FILE: ShareExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements

schemes:
  MyNavigation:
    build:
      targets:
        MyNavigation: all
        MyWidget: all
        ShareExtension: all
    run:
      config: Debug
    archive:
      config: Release
